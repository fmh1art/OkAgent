[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okagent"
version = "0.1.0"
description = "A minimal code agent for budgeted hiring proxy training and evaluation"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
agent = ["mini-swe-agent==2.4.5", "openai>=2,<3", "jinja2>=3.1,<4", "scikit-learn>=1.4,<2"]
proxy = ["sentence-transformers>=2.7,<6", "transformers>=4.51,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
